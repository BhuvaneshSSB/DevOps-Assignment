# Path: .github/workflows/aws-deploy.yml

name: AWS Deploy

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'backend/**'
      - 'infrastructure/docker/**'
      - '.github/workflows/aws-deploy.yml'

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: 832028462664
  ECR_REPOSITORY: devops-assignment-backend
  ECS_CLUSTER_DEV: devops-assignment-dev-cluster
  ECS_SERVICE_DEV: devops-assignment-backend-service
  ECS_TASK_DEFINITION_DEV: devops-assignment-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com

      - name: Build Docker image
        run: |
          docker build -f infrastructure/docker/Dockerfile.backend \
            -t ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest \
            -t ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }} .

      - name: Push image to Amazon ECR
        run: |
          docker push ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest
          docker push ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Get current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_TASK_DEFINITION_DEV }} \
            --region ${{ env.AWS_REGION }} \
            --query 'taskDefinition' > task-def-full.json

      - name: Clean task definition for re-registration
        run: |
          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' task-def-full.json > task-def-clean.json
          cat task-def-clean.json

      - name: Update image in task definition
        run: |
          jq ".containerDefinitions[0].image = \"${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }}\"" task-def-clean.json > task-def-updated.json
          cat task-def-updated.json

      - name: Register new task definition
        run: |
          aws ecs register-task-definition \
            --cli-input-json file://task-def-updated.json \
            --region ${{ env.AWS_REGION }}

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER_DEV }} \
            --service ${{ env.ECS_SERVICE_DEV }} \
            --task-definition ${{ env.ECS_TASK_DEFINITION_DEV }} \
            --region ${{ env.AWS_REGION }}

      - name: Wait for service to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER_DEV }} \
            --services ${{ env.ECS_SERVICE_DEV }} \
            --region ${{ env.AWS_REGION }}

      - name: Verify deployment
        run: |
          echo "Deployment completed successfully"
          echo "Service: ${{ env.ECS_SERVICE_DEV }}"
          echo "Cluster: ${{ env.ECS_CLUSTER_DEV }}"